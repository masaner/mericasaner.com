        tr: Microsoft Azure · MongoDB · PostgreSQL · Redis

  # Core focus areas highlighting versatility across Forward Deployed engineering, AI Agents, and full-stack systems.
  focusAreas:
    - label:
        en: Forward Deployed & Client Engineering
        tr: Forward Deployed & Müşteri Odaklı Çözümler
      desc:
        en: High-impact client architecture, rapid zero-to-production delivery, integration bridges
        tr: Müşteri odaklı kritik mimariler, sıfırdan canlıya hızlı teslimat, entegrasyon köprüleri
    - label:
        en: AI Agents & Autonomous Pipelines
        tr: Yapay Zekâ Ajanları & Otonom Hatlar
      desc:
        en: Agentic workflows, tool use, LLM orchestration, async background pipelines
        tr: Ajan iş akışları, araç kullanımı, LLM orkestrasyonu, asenkron arkaplan hatları
    - label:
        en: Full Stack Web & Cloud Systems
        tr: Full Stack Web & Bulut Sistemleri
      desc:
        en: TypeScript, Python, Node.js, Next.js, Azure, PostgreSQL, scalable microservices
        tr: TypeScript, Python, Node.js, Next.js, Azure, PostgreSQL, ölçeklenebilir mikroservisler
    - label:
        en: Enterprise Integrations & APIs
        tr: Kurumsal Entegrasyonlar & API'ler
      desc:
        en: OAuth 2.0, REST/GraphQL APIs, Salesforce Platform, MuleSoft, Data Cloud
        tr: OAuth 2.0, REST/GraphQL API, Salesforce Platformu, MuleSoft, Data Cloud

  # Hobby & side projects showcasing independent mobile app & product engineering.
  sideProjects:
    title:
      en: Side Projects & Mobile Applications (Hobby)
      tr: Yan Projeler & Mobil Uygulamalar (Hobi)
    description:
      en: >-
        Outside of my professional enterprise engineering work, I build mobile applications and indie
        software products as an active passion hobby.
      tr: >-
        Kurumsal mühendislik kariyerimin yanı sıra, boş zamanlarımda bir hobi olarak mobil uygulamalar
        ve bağımsız yazılım ürünleri geliştiriyorum.
    items:
      - name: Runapy
        url: https://runapyhub.com
        badge:
          en: iOS Mobile App · Hobby Project
          tr: iOS Mobil Uygulama · Hobi Projesi
        description:
          en: >-
            My first mobile app — an all-in-one running club management platform and companion iOS
            application featuring smart pace groups, verified QR check-ins, runner reels, and community events.
          tr: >-
            İlk mobil uygulamam — koşu kulüpleri için akıllı tempo grupları, doğrulanmış QR katılımı,
            koşucu fotoğraf akışları ve topluluk etkinlikleri sunan hepsi bir arada yönetim platformu ve iOS uygulaması.
        tags:
          - iOS (Swift)
          - Mobile Architecture
          - Next.js
          - Cloud APIs
      - name: Americasoftware
        url: https://americasoftware.dev
        badge:
          en: Personal Software Studio
          tr: Kişisel Yazılım Stüdyosu
        description:
          en: >-
            My independent digital workshop and showcase where I experiment with modern frameworks,
            build custom microservices, and deploy side applications and developer utilities.
          tr: >-
            Modern teknolojileri deneyimlediğim, özel mikroservisler kurguladığım, hobi amaçlı mobil ve web
            uygulamalarını sergilediğim kişisel geliştirici alanım.
        tags:
          - Indie Building
          - Mobile & Web Apps
          - Microservices
          - Full Stack

