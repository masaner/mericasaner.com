main:
  name: Meriç Alper Aşaner
  shortName: Meriç
  initials: MA

  title:
    en: Senior Full Stack Engineer & Integration Architect
    tr: Kıdemli Full Stack Yazılım Mühendisi & Entegrasyon Mimarı

  # Wrap the highlighted words in *asterisks*.
  headline:
    en: Building scalable full-stack applications & *enterprise integrations.*
    tr: Ölçeklenebilir full stack uygulamalar ve *kurumsal entegrasyonlar.*

  # {years} is replaced automatically with your years of experience (from careerStart).
  lede:
    en: >-
      {years}+ years engineering robust web applications, high-throughput REST APIs, and automated
      data pipelines across modern cloud environments (TypeScript, Python, Azure) with deep enterprise
      CRM & Salesforce ecosystem expertise.
    tr: >-
      Modern bulut ortamlarında (TypeScript, Python, Azure) güçlü web uygulamaları, yüksek hacimli
      REST API'ler ve veri hatları kurgulayarak geçen {years}+ yıl — derin kurumsal CRM ve Salesforce
      ekosistemi uzmanlığıyla bir arada.

  location:
    en: Istanbul, Türkiye
    tr: İstanbul, Türkiye
  timezone: Europe/Istanbul

  email: meric@mericasaner.com
  openToWork: true
  careerStart: 2021-07

  # Drop a square photo into src/assets/ and put its file name here, e.g. profile.jpg
  # photo: profile.jpg

  links:
    linkedin: https://www.linkedin.com/in/meric-asaner/
    github: https://github.com/masaner
    americasoftware: https://americasoftware.dev
    runapy: https://runapyhub.com
    # trailhead: https://www.salesforce.com/trailblazer/your-id

  about:
    en:
      - >-
        I'm a full stack software engineer who bridges modern web technologies with complex
        enterprise backends. While my technical toolkit spans TypeScript, Python, Node.js, relational
        and document databases, I bring a unique superpower: deep expertise inside the Salesforce
        ecosystem and the mission-critical integration layers connecting it to external clouds.
      - >-
        From architecting OAuth 2.0 and Microsoft Entra ID authentication to building high-performance
        reactive interfaces (React, Next.js, Lightning Web Components) and orchestrating chained
        asynchronous data pipelines, I focus on clean code, test-driven reliability (mock-driven unit
        tests, Selector patterns), and continuous delivery.
      - >-
        Whether designing greenfield web platforms or untangling legacy enterprise architectures, I care
        about building maintainable systems that scale smoothly, respect strict compliance standards,
        and remain an absolute joy for other engineers to extend.
      - >-
        On the side, I explore mobile application architecture and indie product building as an active
        hobby under my personal software studio, Americasoftware. I recently designed and shipped
        Runapy, an iOS mobile application and community platform for running clubs.
    tr:
      - >-
        Modern web teknolojilerini karmaşık kurumsal backend sistemleriyle buluşturan bir full stack
        yazılım mühendisiyim. Teknik araç setim TypeScript, Python, Node.js, ilişkisel ve doküman
        veritabanlarını kapsarken, kurumsal dünyada fark yaratan bir avantaja da sahibim: Salesforce
        ekosisteminde ve onu harici bulut sistemlerine bağlayan kritik entegrasyon katmanlarında derin
        tecrübe.
      - >-
        OAuth 2.0 ve Microsoft Entra ID kimlik doğrulamasından yüksek performanslı reaktif arayüzlere
        (React, Next.js, Lightning Web Components) ve zincirlenmiş asenkron veri hatlarına kadar odak
        noktam; temiz kod, test odaklı güvenilirlik (mock tabanlı birim testleri, Selector kalıpları)
        ve sürekli dağıtımdır (CI/CD).
      - >-
        İster sıfırdan yeni bir web platformu inşa etmek olsun, ister karmaşık kurumsal mimarileri
        dönüştürmek; ölçeklenebilir, regülasyonlara uyumlu ve diğer mühendislerin üzerinde keyifle
        geliştirebileceği sistemler kurmaya odaklanırım.
      - >-
        Kurumsal mühendisliğin yanı sıra, kişisel yazılım stüdyom Americasoftware çatısı altında bir hobi
        olarak mobil uygulama mimarisi ve bağımsız ürün geliştirme çalışmaları yürütüyorum. Yakın zamanda
        koşu kulüpleri için bir iOS mobil uygulaması ve topluluk platformu olan Runapy'yi tasarlayıp yayına aldım.

  languages:
    - name: { en: Turkish, tr: Türkçe }
      level: { en: Native, tr: Ana dil }
    - name: { en: English, tr: İngilizce }
      level: { en: Native, tr: Ana dil seviyesinde }

  # Core architecture highlights card in the hero section.
  recordFields:
    - label: { en: Core Stack, tr: Temel Teknoloji }
