    tr: >-
      Temel Salesforce CRM süreçlerini harici gayrimenkul platformlarına bağlayan güvenli REST API uç
      noktaları tasarlayıp entegre ettim.
  - en: >-
      Developed and maintained custom Salesforce applications powering core brokerage operations,
      automating multi-step CRM workflows for greater process efficiency.
    tr: >-
      Temel brokerlık operasyonlarını yürüten özel Salesforce uygulamaları geliştirip sürdürdüm; çok
      adımlı CRM iş akışlarını otomatikleştirerek süreç verimliliğini artırdım.
